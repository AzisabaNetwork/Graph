name: Publish Java SDK

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish (for example: 1.0.0 or 1.0.0-SNAPSHOT)"
        required: true
        type: string
    secrets:
      REPO_USERNAME:
        required: true
      REPO_PASSWORD:
        required: true

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (for example: 1.0.0 or 1.0.0-SNAPSHOT)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-java-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to repo.azisaba.net
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install generator dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and publish Java SDK
        env:
          REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            export MAVEN_REPOSITORY_URL="https://repo.azisaba.net/repository/maven-snapshots/"
          else
            export MAVEN_REPOSITORY_URL="https://repo.azisaba.net/repository/maven-releases/"
          fi

          pnpm exec fern generate --group publish-java --local --version "$VERSION"
