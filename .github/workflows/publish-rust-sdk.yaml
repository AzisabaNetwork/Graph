name: Publish Rust SDK
run-name: Publish Rust SDK ${{ inputs.version }} (${{ inputs.caller_run_id || github.run_id }})

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string
      caller_run_id:
        description: Identifier used by the aggregate publishing workflow
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string
      caller_run_id:
        description: Identifier used by the aggregate publishing workflow
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-rust-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install generator dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Rust SDK
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm generate:rust-sdk --additional-properties packageVersion="$VERSION"

      - name: Validate package metadata
        working-directory: sdks/rust/generated
        run: |
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].license')" = "MIT"
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "${{ inputs.version }}"

      - name: Build and test Rust SDK
        working-directory: sdks/rust/generated
        run: |
          cargo check --all-targets
          cargo test

      - name: Verify crates.io package
        working-directory: sdks/rust/generated
        run: cargo publish --dry-run

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        working-directory: sdks/rust/generated
        run: cargo publish
