name: Publish TypeScript SDK
run-name: Publish TypeScript SDK ${{ inputs.version }} (${{ inputs.caller_run_id || github.run_id }})

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string
      caller_run_id:
        description: Identifier used by the aggregate publishing workflow
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string
      caller_run_id:
        description: Identifier used by the aggregate publishing workflow
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-typescript-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npmjs
    runs-on: ubuntu-latest
    environment: npmjs
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install generator dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript SDK
        env:
          VERSION: ${{ inputs.version }}
        run: pnpm generate:typescript-sdk --additional-properties npmVersion="$VERSION"

      - name: Validate package metadata
        env:
          VERSION: ${{ inputs.version }}
        working-directory: sdks/typescript/generated
        run: |
          npm version "$VERSION" --allow-same-version --no-git-tag-version
          npm pkg set \
            repository.type=git \
            repository.url=https://github.com/AzisabaNetwork/Graph.git

      - name: Install SDK dependencies
        working-directory: sdks/typescript/generated
        run: npm install --ignore-scripts --no-package-lock

      - name: Build SDK
        working-directory: sdks/typescript/generated
        run: npm run build

      - name: Publish package
        env:
          VERSION: ${{ inputs.version }}
        working-directory: sdks/typescript/generated
        run: |
          if [[ "$VERSION" == *-* ]]; then
            tag=next
          else
            tag=latest
          fi

          npm publish \
            --access public \
            --tag "$tag" \
            --ignore-scripts \
            --provenance
