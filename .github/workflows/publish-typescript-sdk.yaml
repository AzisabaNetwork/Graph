name: Publish TypeScript SDK

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string

  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-typescript-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npmjs
    runs-on: ubuntu-latest
    environment: npmjs
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install generator dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and publish TypeScript SDK
        run: pnpm exec fern generate --group publish-typescript --local --version "${{ inputs.version }}"
