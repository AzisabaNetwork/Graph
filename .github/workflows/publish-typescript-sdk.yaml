name: Publish TypeScript SDK
run-name: Publish TypeScript SDK ${{ inputs.version }} (${{ inputs.caller_run_id || github.run_id }})

on:
  workflow_call:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string
      caller_run_id:
        description: Identifier used by the aggregate publishing workflow
        required: false
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string
      caller_run_id:
        description: Identifier used by the aggregate publishing workflow
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-typescript-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npmjs
    runs-on: ubuntu-latest
    environment: npmjs
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Check package version availability
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if npm view "@azisaba/graph@$VERSION" version >/dev/null 2>&1; then
            echo "::error title=Version already published::@azisaba/graph@$VERSION already exists on npm. Choose a new version."
            exit 1
          fi

      - name: Install generator dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript SDK
        env:
          VERSION: ${{ inputs.version }}
        run: |
          pnpm exec rimraf sdks/typescript/generated
          pnpm exec openapi-generator-cli generate \
            -c sdks/typescript/config.yaml \
            --additional-properties npmVersion="$VERSION"
          node sdks/typescript/postprocess.ts

      - name: Validate package metadata
        env:
          VERSION: ${{ inputs.version }}
        working-directory: sdks/typescript/generated
        run: |
          actual_version="$(node -p 'require("./package.json").version')"
          echo "Expected version: $VERSION"
          echo "Generated version: $actual_version"
          test "$actual_version" = "$VERSION"
          npm pkg set \
            repository.type=git \
            repository.url=https://github.com/AzisabaNetwork/Graph.git

      - name: Install SDK dependencies
        working-directory: sdks/typescript/generated
        run: npm install --ignore-scripts --no-package-lock

      - name: Build SDK
        working-directory: sdks/typescript/generated
        run: npm run build

      - name: Publish package
        env:
          VERSION: ${{ inputs.version }}
        working-directory: sdks/typescript/generated
        run: |
          if [[ "$VERSION" == *-* ]]; then
            tag=next
          else
            tag=latest
          fi

          npm publish \
            --access public \
            --tag "$tag" \
            --ignore-scripts \
            --provenance
