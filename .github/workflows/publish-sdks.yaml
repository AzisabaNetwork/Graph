name: Publish SDKs

on:
  workflow_call:
    inputs:
      typescript_version:
        description: TypeScript SDK version to publish
        required: true
        type: string
      java_version:
        description: Java SDK version to publish
        required: true
        type: string
      rust_version:
        description: Rust SDK version to publish
        required: true
        type: string

  workflow_dispatch:
    inputs:
      typescript_version:
        description: TypeScript SDK version to publish
        required: true
        type: string
      java_version:
        description: "Java SDK version to publish (for example: 1.0.0 or 1.0.0-SNAPSHOT)"
        required: true
        type: string
      rust_version:
        description: Rust SDK version to publish
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.language }} SDK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: TypeScript
            workflow: publish-typescript-sdk.yaml
            version: ${{ inputs.typescript_version }}
          - language: Java
            workflow: publish-java-sdk.yaml
            version: ${{ inputs.java_version }}
          - language: Rust
            workflow: publish-rust-sdk.yaml
            version: ${{ inputs.rust_version }}

    steps:
      - name: Dispatch ${{ matrix.language }} publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_VERSION: ${{ matrix.version }}
          TARGET_WORKFLOW: ${{ matrix.workflow }}
        run: |
          gh workflow run "$TARGET_WORKFLOW" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --field version="$PUBLISH_VERSION" \
            --field caller_run_id="$GITHUB_RUN_ID"

      - name: Wait for ${{ matrix.language }} publishing workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_WORKFLOW: ${{ matrix.workflow }}
          TARGET_RUN_NAME: Publish ${{ matrix.language }} SDK ${{ matrix.version }} (${{ github.run_id }})
        run: |
          run_id=""
          for _ in {1..30}; do
            run_id="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$TARGET_WORKFLOW" \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle == \"$TARGET_RUN_NAME\") | .databaseId" \
              | head -n 1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo "Timed out waiting for $TARGET_WORKFLOW to start" >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status
