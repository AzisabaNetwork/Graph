# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json

api:
  specs:
    - openapi: ../openapi/openapi.yaml

groups:
  typescript:
    generators:
      - &typescript-generator
        name: fern-typescript-sdk
        version: 3.87.3
        config:
          packageJson:
            name: "@azisaba/graph"
            description: TypeScript SDK for the Azisaba Graph API.
            license: MIT
            repository:
              type: git
              url: git+https://github.com/AzisabaNetwork/Graph.git
            bugs:
              url: https://github.com/AzisabaNetwork/Graph/issues
            homepage: https://github.com/AzisabaNetwork/Graph#readme
        output:
          location: local-file-system
          path: ../sdks/typescript

  java:
    generators:
      - &java-generator
        name: fern-java-sdk
        version: 4.17.1
        config:
          package-prefix: net.azisaba.graph
          use-local-date-for-dates: true
        metadata:
          author: Azisaba Network
          package-description: Java SDK for the Azisaba Graph API.
          reference-url: https://github.com/AzisabaNetwork/Graph
          license: MIT
        output:
          location: local-file-system
          path: ../sdks/java

  rust:
    generators:
      - &rust-generator
        name: fern-rust-sdk
        version: 0.44.3
        config:
          clientClassName: GraphClient
          crateName: azisaba-graph
          packageDescription: Rust SDK for the Azisaba Graph API.
          packageLicense: MIT
          packageRepository: https://github.com/AzisabaNetwork/Graph
          packageDocumentation: https://docs.rs/azisaba-graph
        output:
          location: local-file-system
          path: ../sdks/rust

  publish-typescript:
    generators:
      - <<: *typescript-generator
        output:
          location: npm
          package-name: "@azisaba/graph"
          token: OIDC

  publish-java:
    generators:
      - <<: *java-generator
        output:
          location: maven
          url: ${MAVEN_REPOSITORY_URL}
          coordinate: net.azisaba.graph:graph
          username: ${REPO_USERNAME}
          password: ${REPO_PASSWORD}

  publish-rust:
    generators:
      - <<: *rust-generator
        output:
          location: crates
          package-name: azisaba-graph
          token: ${CRATES_IO_API_KEY}
