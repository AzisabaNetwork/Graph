openapi: 3.1.0

info:
  title: Azisaba Graph API
  version: 0.0.1
  license:
    name: MIT License
    identifier: MIT

servers:
  - url: "https://graph.azisaba.net"

security:
  - ApiKeyAuth: []

tags:
  - name: patch-notes
    description: Operations related to patch notes.

paths:
  /patch-notes:
    $ref: "./paths/patch-notes/patch-notes.yaml"
  /patch-notes/{patchNoteId}:
    $ref: "./paths/patch-notes/patch-notes-by-id.yaml"

components:
  parameters:
    PatchNoteId:
      $ref: "./components/parameters/patch-note-id.yaml"

  schemas:
    CreatePatchNoteRequest:
      $ref: "./components/schemas/create-patch-note-request.yaml"
    ListPatchNotesResponse:
      $ref: "./components/schemas/list-patch-notes-response.yaml"
    PatchNote:
      $ref: "./components/schemas/patch-note.yaml"
    PatchNoteCategory:
      $ref: "./components/schemas/patch-note-category.yaml"
    PatchNoteId:
      $ref: "./components/schemas/patch-note-id.yaml"
    PatchNoteTarget:
      $ref: "./components/schemas/patch-note-target.yaml"

  securitySchemes:
    ApiKeyAuth:
      $ref: "./components/security-schemes/api-key-auth.yaml"
