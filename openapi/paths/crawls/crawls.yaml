get:
  summary: List crawls.
  operationId: listCrawls
  tags:
    - crawls
  security:
    - apiKeyAuth:
        - crawls:read
  parameters:
    - name: limit
      in: query
      description: The maximum number of crawls to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    - name: cursor
      in: query
      description: The cursor returned by the previous request.
      schema:
        type: string

    - name: address
      in: query
      description: The address used to filter crawls.
      schema:
        $ref: "../../components/schemas/crawl.yaml#/properties/address"

    - name: port
      in: query
      description: The port used to filter crawls.
      schema:
        $ref: "../../components/schemas/crawl.yaml#/properties/port"

    - name: version
      in: query
      description: The version used to filter crawls.
      schema:
        $ref: "../../components/schemas/crawl.yaml#/properties/version"

    - name: protocolVersion
      in: query
      description: The protocol version used to filter crawls.
      schema:
        $ref: "../../components/schemas/crawl.yaml#/properties/protocolVersion"

    - name: crawledFrom
      in: query
      description: The inclusive lower bound of the crawl date and time.
      schema:
        type: string
        format: date-time

    - name: crawledTo
      in: query
      description: The exclusive upper bound of the crawl date and time.
      schema:
        type: string
        format: date-time
  responses:
    "200":
      description: The crawls were retrieved successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/ListCrawlsResponse"
    "400":
      description: The request contains invalid query parameters.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"

post:
  summary: Create a crawl.
  operationId: createCrawl
  tags:
    - crawls
  security:
    - apiKeyAuth:
        - crawls:write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../openapi.yaml#/components/schemas/CreateCrawlRequest"
  responses:
    "201":
      description: The crawl was created successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Crawl"
    "400":
      description: The request body is invalid.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
