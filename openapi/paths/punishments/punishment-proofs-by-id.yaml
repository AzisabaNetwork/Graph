get:
  operationId: getPunishmentProofById
  summary: Get punishment proof
  description: Returns the specified proof for the specified punishment.
  tags:
    - punishments
  security:
    - apiKeyAuth:
        - punishments:read
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PunishmentId"
    - $ref: "../../openapi.yaml#/components/parameters/ProofId"
  responses:
    "200":
      description: The proof was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Proof"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The punishment or proof was not found.

patch:
  operationId: updatePunishmentProofById
  summary: Update punishment proof
  description: Updates the specified proof for the specified punishment.
  tags:
    - punishments
  security:
    - apiKeyAuth:
        - punishments:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PunishmentId"
    - $ref: "../../openapi.yaml#/components/parameters/ProofId"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            text:
              $ref: "../../components/schemas/proof.yaml#/properties/text"
            public:
              $ref: "../../components/schemas/proof.yaml#/properties/public"
  responses:
    "200":
      description: The proof was updated successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Proof"
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The punishment or proof was not found.

delete:
  operationId: deletePunishmentProofById
  summary: Delete punishment proof
  description: Deletes the specified proof from the specified punishment.
  tags:
    - punishments
  security:
    - apiKeyAuth:
        - punishments:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PunishmentId"
    - $ref: "../../openapi.yaml#/components/parameters/ProofId"
  responses:
    "204":
      description: The proof was deleted successfully.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The punishment or proof was not found.
