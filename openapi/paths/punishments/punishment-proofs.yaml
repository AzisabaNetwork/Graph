get:
  operationId: listPunishmentProofs
  summary: List punishment proofs
  description: Returns proofs attached to the specified punishment.
  tags:
    - punishments
  security:
    - apiKeyAuth:
        - punishments:read
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PunishmentId"
  responses:
    "200":
      description: The proofs were retrieved successfully.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../openapi.yaml#/components/schemas/Proof"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The punishment was not found.

post:
  operationId: createPunishmentProof
  summary: Create punishment proof
  description: Creates a proof for the specified active punishment.
  tags:
    - punishments
  security:
    - apiKeyAuth:
        - punishments:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PunishmentId"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - text
            - public
          properties:
            text:
              $ref: "../../components/schemas/proof.yaml#/properties/text"
            public:
              $ref: "../../components/schemas/proof.yaml#/properties/public"
  responses:
    "201":
      description: The proof was created successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Proof"
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The active punishment was not found.
