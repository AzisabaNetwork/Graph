get:
  operationId: getPunishmentById
  summary: Get punishment
  description: Returns the punishment with the specified ID.
  tags:
    - punishments
  security:
    - apiKeyAuth:
        - punishments:read
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PunishmentId"
  responses:
    "200":
      description: The punishment was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Punishment"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The punishment was not found.

patch:
  operationId: updatePunishmentById
  summary: Update punishment
  description: Updates the active punishment with the specified ID.
  tags:
    - punishments
  security:
    - apiKeyAuth:
        - punishments:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PunishmentId"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            reason:
              $ref: "../../components/schemas/punishment.yaml#/properties/reason"
            seen:
              $ref: "../../components/schemas/punishment.yaml#/properties/seen"
  responses:
    "200":
      description: The punishment was updated successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Punishment"
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The active punishment was not found.

delete:
  operationId: deletePunishmentById
  summary: Revoke punishment
  description: Revokes the active punishment with the specified ID.
  tags:
    - punishments
  security:
    - apiKeyAuth:
        - punishments:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PunishmentId"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - reason
          properties:
            reason:
              $ref: "../../components/schemas/revocation.yaml#/properties/reason"
  responses:
    "204":
      description: The punishment was revoked successfully.
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The active punishment was not found.
