get:
  summary: Get a patch note by ID
  operationId: getPatchNoteById
  tags:
    - patch-notes
  security:
    - ApiKeyAuth:
        - patch-notes:read
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PatchNoteId"
  responses:
    "200":
      description: The patch note was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/PatchNote"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The patch note was not found.

delete:
  summary: Delete a patch note by ID
  operationId: deletePatchNoteById
  tags:
    - patch-notes
  security:
    - ApiKeyAuth:
        - patch-notes:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PatchNoteId"
  responses:
    "204":
      description: The patch note was deleted successfully.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The patch note was not found.
