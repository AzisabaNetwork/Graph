get:
  operationId: getPatchNoteById
  summary: Get patch note
  description: Returns the patch note with the specified ID.
  tags:
    - patch-notes
  security:
    - apiKeyAuth:
        - patch-notes:read
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PatchNoteId"
  responses:
    "200":
      description: The patch note was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/PatchNote"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The patch note was not found.

delete:
  operationId: deletePatchNoteById
  summary: Delete patch note
  description: Deletes the patch note with the specified ID.
  tags:
    - patch-notes
  security:
    - apiKeyAuth:
        - patch-notes:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PatchNoteId"
  responses:
    "204":
      description: The patch note was deleted successfully.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The patch note was not found.
