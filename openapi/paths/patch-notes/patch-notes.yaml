get:
  summary: List patch notes
  operationId: listPatchNotes
  tags:
    - patch-notes
  security:
    - apiKeyAuth:
        - patch-notes:read
  parameters:
    - name: limit
      in: query
      description: The maximum number of patch notes to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    - name: cursor
      in: query
      description: The cursor returned by the previous request.
      schema:
        type: string

    - name: target
      in: query
      description: The target used to filter patch notes.
      schema:
        $ref: "../../openapi.yaml#/components/schemas/PatchNoteTarget"

    - name: category
      in: query
      description: The category used to filter patch notes.
      schema:
        $ref: "../../openapi.yaml#/components/schemas/PatchNoteCategory"
  responses:
    "200":
      description: The patch notes were retrieved successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/ListPatchNotesResponse"
    "400":
      description: The request contains invalid query parameters.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"

post:
  summary: Create a patch note
  operationId: createPatchNote
  tags:
    - patch-notes
  security:
    - apiKeyAuth:
        - patch-notes:write
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: "../../openapi.yaml#/components/schemas/CreatePatchNoteRequest"
  responses:
    "201":
      description: The patch note was created successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/PatchNote"
    "400":
      description: The request body is invalid.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
