get:
  operationId: listPatchNotes
  summary: List patch notes
  description: Returns a list of patch notes.
  tags:
    - patch-notes
  security:
    - apiKeyAuth:
        - patch-notes:read
  parameters:
    - name: limit
      in: query
      description: The maximum number of patch notes to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: cursor
      in: query
      description: The cursor returned by the previous request.
      schema:
        type: string
    - name: target
      in: query
      description: The target used to filter patch notes.
      schema:
        $ref: "../../openapi.yaml#/components/schemas/PatchNoteTarget"
    - name: category
      in: query
      description: The category used to filter patch notes.
      schema:
        $ref: "../../openapi.yaml#/components/schemas/PatchNoteCategory"
    - name: authorId
      in: query
      description: The unique identifier of the author used to filter patch notes.
      schema:
        type: string
        format: uuid
    - name: createdFrom
      in: query
      description: The inclusive lower bound of the creation date and time.
      schema:
        type: string
        format: date-time
    - name: createdTo
      in: query
      description: The exclusive upper bound of the creation date and time.
      schema:
        type: string
        format: date-time
  responses:
    "200":
      description: The patch notes were retrieved successfully.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - nextCursor
            properties:
              items:
                type: array
                items:
                  $ref: "../../openapi.yaml#/components/schemas/PatchNote"
              nextCursor:
                type:
                  - string
                  - "null"
                description: The cursor for retrieving the next page, or `null` if no more results are available.
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"

post:
  operationId: createPatchNote
  summary: Create patch note
  description: Creates a new patch note.
  tags:
    - patch-notes
  security:
    - apiKeyAuth:
        - patch-notes:write
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required:
            - target
            - category
            - title
            - body
          properties:
            target:
              $ref: "../../components/schemas/patch-note.yaml#/properties/target"
            category:
              $ref: "../../components/schemas/patch-note.yaml#/properties/category"
            title:
              $ref: "../../components/schemas/patch-note.yaml#/properties/title"
            body:
              $ref: "../../components/schemas/patch-note.yaml#/properties/body"
            authorId:
              allOf:
                - $ref: "../../openapi.yaml#/components/schemas/PlayerId"
              description: The ID of the patch note author. Omit this field if the author is unknown.
            images:
              type: array
              description: JPEG, PNG, GIF, or WebP image files to attach to the patch note.
              items:
                type: string
                format: binary
  responses:
    "201":
      description: The patch note was created successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/PatchNote"
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
