get:
  operationId: getApiKeyById
  summary: Get API key
  description: Returns the API key with the specified ID.
  tags:
    - api-keys
  security:
    - apiKeyAuth:
        - api-keys:read
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/ApiKeyId"
  responses:
    "200":
      description: The API key was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/ApiKey"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The API key was not found.

patch:
  operationId: updateApiKeyById
  summary: Update API key
  description: Updates the API key with the specified ID.
  tags:
    - api-keys
  security:
    - apiKeyAuth:
        - api-keys:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/ApiKeyId"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            name:
              $ref: "../../components/schemas/api-key.yaml#/properties/name"
            scopes:
              allOf:
                - $ref: "../../components/schemas/api-key.yaml#/properties/scopes"
              description: The scopes to grant to the API key. The API key used to make the request must be authorized to delegate each requested scope.
            expiresAt:
              $ref: "../../components/schemas/api-key.yaml#/properties/expiresAt"
            playerId:
              $ref: "../../components/schemas/api-key.yaml#/properties/playerId"
  responses:
    "200":
      description: The API key was updated successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/ApiKey"
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The API key was not found.

delete:
  operationId: deleteApiKeyById
  summary: Delete API key
  description: Deletes the API key with the specified ID.
  tags:
    - api-keys
  security:
    - apiKeyAuth:
        - api-keys:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/ApiKeyId"
  responses:
    "204":
      description: The API key was deleted successfully.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The API key was not found.
