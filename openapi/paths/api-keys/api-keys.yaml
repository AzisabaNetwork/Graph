get:
  operationId: listApiKeys
  summary: List API keys
  description: Returns a list of API keys.
  tags:
    - api-keys
  security:
    - apiKeyAuth:
        - api-keys:read
  parameters:
    - name: limit
      in: query
      description: The maximum number of API keys to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: cursor
      in: query
      description: The cursor returned by the previous request.
      schema:
        type: string
    - name: playerId
      in: query
      description: The unique identifier of the player used to filter API keys.
      schema:
        type: string
        format: uuid
    - name: createdFrom
      in: query
      description: The inclusive lower bound of the creation date and time.
      schema:
        type: string
        format: date-time
    - name: createdTo
      in: query
      description: The exclusive upper bound of the creation date and time.
      schema:
        type: string
        format: date-time
    - name: expiresFrom
      in: query
      description: The inclusive lower bound of the expiration date and time.
      schema:
        type: string
        format: date-time
    - name: expiresTo
      in: query
      description: The exclusive upper bound of the expiration date and time.
      schema:
        type: string
        format: date-time
  responses:
    "200":
      description: The API keys were retrieved successfully.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - nextCursor
            properties:
              items:
                type: array
                items:
                  $ref: "../../openapi.yaml#/components/schemas/ApiKey"
              nextCursor:
                type:
                  - string
                  - "null"
                description: The cursor for retrieving the next page, or `null` if no more results are available.
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"

post:
  operationId: createApiKey
  summary: Create API key
  description: Creates a new API key.
  tags:
    - api-keys
  security:
    - apiKeyAuth:
        - api-keys:write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          required:
            - name
            - scopes
          properties:
            name:
              $ref: "../../components/schemas/api-key.yaml#/properties/name"
            scopes:
              allOf:
                - $ref: "../../components/schemas/api-key.yaml#/properties/scopes"
              description: >
                The scopes required for the new API key. The API key used to make the
                request must be authorized to delegate each requested scope.
            expiresAt:
              allOf:
                - $ref: "../../components/schemas/api-key.yaml#/properties/expiresAt"
              description: The future date and time at which the API key expires, or `null` if it does not expire.
            playerId:
              $ref: "../../components/schemas/api-key.yaml#/properties/playerId"
  responses:
    "201":
      description: The API key was created successfully.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "../../openapi.yaml#/components/schemas/ApiKey"
              - type: object
                required:
                  - apiKey
                properties:
                  apiKey:
                    type: string
                    pattern: "^azk_live_[A-Za-z0-9_-]{16}\\.[A-Za-z0-9_-]{43}$"
                    description: >
                      The generated API key. This value is returned only once and
                      must be stored securely by the client.
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
