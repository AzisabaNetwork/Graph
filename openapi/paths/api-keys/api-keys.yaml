get:
  summary: List API keys.
  operationId: listApiKeys
  tags:
    - api-keys
  security:
    - apiKeyAuth:
        - api-keys:read
  parameters:
    - name: limit
      in: query
      description: The maximum number of API keys to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    - name: cursor
      in: query
      description: The cursor returned by the previous request.
      schema:
        type: string
  responses:
    "200":
      description: The API keys were retrieved successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/ListApiKeysResponse"
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"

post:
  summary: Create an API key
  operationId: createApiKey
  tags:
    - api-keys
  security:
    - apiKeyAuth:
        - api-keys:write
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../../openapi.yaml#/components/schemas/CreateApiKeyRequest"
  responses:
    "201":
      description: The API key was created successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/CreateApiKeyResponse"
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
