/patch-notes:
  get:
    summary: List patch notes
    operationId: listPatchNotes
    tags:
      - patch-notes
    parameters:
      - name: limit
        in: query
        description: Maximum number of patch notes to return.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20

      - name: cursor
        in: query
        description: Cursor returned by the previous request.
        schema:
          type: string

      - name: target
        in: query
        description: Target by which to filter patch notes.
        schema:
          $ref: "../components/schemas/patch-note-target.yaml"

      - name: category
        in: query
        description: Category by which to filter patch notes.
        schema:
          $ref: "../components/schemas/patch-note-category.yaml"
    responses:
      "200":
        description: Patch notes retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/list-patch-notes-response.yaml"
      "400":
        description: Invalid query parameters.
  post:
    summary: Create a patch note
    operationId: createPatchNote
    tags:
      - patch-notes
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/create-patch-note-request.yaml"
    responses:
      "201":
        description: Patch note created successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/patch-note.yaml"
      "400":
        description: Invalid request body.

/patch-notes/{patchNoteId}:
  get:
    summary: Get a patch note by ID
    operationId: getPatchNoteById
    tags:
      - patch-notes
    parameters:
      - $ref: "../components/parameters/patch-note-id.yaml"
    responses:
      "200":
        description: Patch note retrieved successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/patch-note.yaml"
      "404":
        description: Patch note not found.

  delete:
    summary: Delete a patch note by ID
    operationId: deletePatchNoteById
    tags:
      - patch-notes
    parameters:
      - $ref: "../components/parameters/patch-note-id.yaml"
    responses:
      "204":
        description: Patch note deleted successfully.
      "404":
        description: Patch note not found.
