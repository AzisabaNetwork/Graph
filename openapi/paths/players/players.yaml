get:
  operationId: listPlayers
  summary: List players
  description: |
    Returns a list of players.
    The `discordId` field is `null` unless the API key has the `players:read-details` scope.
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:read
    - apiKeyAuth:
        - players:read-details
  parameters:
    - name: limit
      in: query
      description: The maximum number of players to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: cursor
      in: query
      description: The cursor returned by the previous request.
      schema:
        type: string
    - name: discordId
      in: query
      description: The Discord user ID used to filter players. Requires the `players:read-details` scope.
      schema:
        type: string
        maxLength: 20
    - name: status
      in: query
      description: The online status used to filter players.
      schema:
        $ref: "../../openapi.yaml#/components/schemas/PlayerStatus"
  responses:
    "200":
      description: The players were retrieved successfully.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - nextCursor
            properties:
              items:
                type: array
                items:
                  $ref: "../../openapi.yaml#/components/schemas/Player"
              nextCursor:
                type:
                  - string
                  - "null"
                description: The cursor for retrieving the next page, or `null` if no more results are available.
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
