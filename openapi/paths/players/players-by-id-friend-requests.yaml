get:
  summary: List player friend requests
  description: Returns a list of friend requests received by the specified player.
  operationId: listPlayerFriendRequests
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:read
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"

    - name: limit
      in: query
      description: The maximum number of friend requests to return.
      minimum: 1
      maximum: 100
      default: 20

    - name: cursor
      in: query
      description: The cursor returned by the previous request.
      schema:
        type: string
  responses:
    "200":
      description: The player's friend requests were retrieved successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/ListPlayersResponse"
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player was not found.
