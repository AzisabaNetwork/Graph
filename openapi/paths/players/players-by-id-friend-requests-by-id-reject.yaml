put:
  operationId: rejectPlayerFriendRequest
  summary: Reject player friend request
  description: Rejects the specified sender's friend request and removes it from the player's friend requests.
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"
    - $ref: "../../openapi.yaml#/components/parameters/PlayerFriendRequestSenderId"
  responses:
    "204":
      description: The friend request was rejected successfully.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player, sender, or friend request was not found.
