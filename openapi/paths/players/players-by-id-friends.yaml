get:
  operationId: listPlayerFriends
  summary: List player friends
  description: Returns a list of friends of the specified player.
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:read
    - apiKeyAuth:
        - players:read-details
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"
    - name: limit
      in: query
      description: The maximum number of friends to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    - name: cursor
      in: query
      description: The cursor returned by the previous request.
      schema:
        type: string
    - name: friendId
      in: query
      description: The unique identifier of the friend used to filter friendships.
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: The player's friends were retrieved successfully.
      content:
        application/json:
          schema:
            type: object
            required:
              - items
              - nextCursor
            properties:
              items:
                type: array
                items:
                  $ref: "../../openapi.yaml#/components/schemas/Player"
              nextCursor:
                type:
                  - string
                  - "null"
                description: The cursor for retrieving the next page, or `null` if no more results are available.
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player was not found.
