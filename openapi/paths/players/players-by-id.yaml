get:
  operationId: getPlayerById
  summary: Get player
  description: >
    Returns the player with the specified ID.
    The `discordId` field is `null` unless the API key has the `players:read-details` scope.
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:read
    - apiKeyAuth:
        - players:read-details
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"
  responses:
    "200":
      description: The player was retrieved successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Player"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player was not found.

patch:
  operationId: updatePlayerById
  summary: Update player
  description: Updates the player with the specified ID.
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            discordId:
              allOf:
                - $ref: "../../components/schemas/player.yaml#/properties/discordId"
              description: The Discord user ID to link to the player, or `null` to remove the existing link.
            bio:
              $ref: "../../components/schemas/player.yaml#/properties/bio"
            status:
              $ref: "../../components/schemas/player.yaml#/properties/status"
            currentServer:
              $ref: "../../components/schemas/player.yaml#/properties/currentServer"
            currentLocale:
              $ref: "../../components/schemas/player.yaml#/properties/currentLocale"
            currentClientVersion:
              $ref: "../../components/schemas/player.yaml#/properties/currentClientVersion"
            firstLoginAt:
              $ref: "../../components/schemas/player.yaml#/properties/firstLoginAt"
            lastSeenAt:
              $ref: "../../components/schemas/player.yaml#/properties/lastSeenAt"
  responses:
    "200":
      description: The player was updated successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Player"
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player was not found.
