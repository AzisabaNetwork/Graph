put:
  operationId: addPlayerFriendRequest
  summary: Add player friend request
  description: Adds a friend request from the specified sender to the player's friend requests.
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"
    - $ref: "../../openapi.yaml#/components/parameters/PlayerFriendRequestSenderId"
  responses:
    "204":
      description: The friend request was added successfully.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player or sender was not found.
    "409":
      description: The player is already friends with the sender.

delete:
  operationId: removePlayerFriendRequest
  summary: Remove player friend request
  description: Removes the specified sender's friend request from the player's friend requests.
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"
    - $ref: "../../openapi.yaml#/components/parameters/PlayerFriendRequestSenderId"
  responses:
    "204":
      description: The friend request was removed successfully.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player or sender was not found.
