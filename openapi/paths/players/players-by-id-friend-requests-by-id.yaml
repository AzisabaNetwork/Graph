put:
  summary: Create player friend request
  description: Creates a friend request from the specified sender to the specified player.
  operationId: createPlayerFriendRequest
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"
    - $ref: "../../openapi.yaml#/components/parameters/SenderId"
  responses:
    "204":
      description: The friend request exists.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player or sender was not found.
    "409":
      description: The player is already friends with the sender.

delete:
  summary: Delete player friend request
  description: Deletes a friend request from the specified sender to the specified player.
  operationId: deletePlayerFriendRequest
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"
    - $ref: "../../openapi.yaml#/components/parameters/SenderId"
  responses:
    "204":
      description: The friend request does not exist.
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player or sender was not found.
