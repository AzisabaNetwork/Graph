put:
  operationId: addPlayerFriend
  summary: Add player friend
  description: Adds the specified friend to the player's friends.
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"
    - $ref: "../../openapi.yaml#/components/parameters/PlayerFriendId"
  responses:
    "201":
      description: The friend was added successfully.
      content:
        application/json:
          schema:
            $ref: "../../openapi.yaml#/components/schemas/Player"
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player or friend was not found.
    "409":
      description: The player is already friends with the specified player.

delete:
  operationId: removePlayerFriend
  summary: Remove player friend
  description: Removes the specified friend from the player's friends.
  tags:
    - players
  security:
    - apiKeyAuth:
        - players:write
  parameters:
    - $ref: "../../openapi.yaml#/components/parameters/PlayerId"
    - $ref: "../../openapi.yaml#/components/parameters/PlayerFriendId"
  responses:
    "204":
      description: The friend was removed successfully.
    "400":
      $ref: "../../openapi.yaml#/components/responses/BadRequest"
    "401":
      $ref: "../../openapi.yaml#/components/responses/Unauthorized"
    "403":
      $ref: "../../openapi.yaml#/components/responses/Forbidden"
    "404":
      description: The player or friend was not found.
