type: object
additionalProperties: false
required:
  - name
  - scopes
properties:
  name:
    $ref: "./api-key.yaml#/properties/name"

  scopes:
    allOf:
      - $ref: "./api-key.yaml#/properties/scopes"
    description: |
      The scopes requested for the new API key. The API key used to make the
      request must be authorized to delegate each requested scope.

  expiresAt:
    $ref: "./api-key.yaml#/properties/expiresAt"
