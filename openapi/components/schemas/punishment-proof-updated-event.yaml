type: object
title: PunishmentProofUpdatedEvent
description: >
  Represents an event indicating that a punishment proof was updated.
  Requires the `stream:read` and `punishments:read` scopes to receive this event.
required:
  - type
  - data
properties:
  type:
    const: punishment-proof-updated
  data:
    type: object
    title: PunishmentProofUpdatedEventData
    description: The data associated with the punishment proof.
    required:
      - punishmentId
      - proof
    properties:
      punishmentId:
        $ref: "../../openapi.yaml#/components/schemas/PunishmentId"
      proof:
        $ref: "../../openapi.yaml#/components/schemas/Proof"
