type: object
description: A player profile. The Discord user ID is hidden unless the API key has permission to read it.
required:
  - id
  - discordId
  - username
  - status
  - currentServer
  - bio
properties:
  id:
    $ref: "../../openapi.yaml#/components/schemas/PlayerId"

  discordId:
    type:
      - string
      - "null"
    description: The Discord user ID linked to the player, or `null` if no Discord account is linked or the API key lacks the `players:read-details` scope.

  username:
    type: string
    description: The player's Minecraft username.

  status:
    $ref: "../../openapi.yaml#/components/schemas/PlayerStatus"

  currentServer:
    type:
      - string
      - "null"
    description: The server to which the player is currently connected, or `null` if the player is offline.

  bio:
    type:
      - string
      - "null"
    description: The player's biography of up to 160 characters, or `null` if it is not set.
