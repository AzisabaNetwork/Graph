type: object
title: Player
description: Represents a player profile.
required:
  - id
  - discordId
  - username
  - bio
  - status
  - currentServer
  - currentLocale
  - currentClientVersion
  - firstLoginAt
  - lastSeenAt
properties:
  id:
    $ref: "../../openapi.yaml#/components/schemas/PlayerId"
    readOnly: true
  discordId:
    type:
      - string
      - "null"
    maxLength: 20
    description: The Discord user ID linked to the player, or `null` if no Discord account is linked or the API key lacks the `players:read-details` scope.
  username:
    $ref: "../../openapi.yaml#/components/schemas/PlayerUsername"
    readOnly: true
  bio:
    type:
      - string
      - "null"
    minLength: 1
    maxLength: 160
    description: The player's biography of up to 160 characters, or `null` if it is not set.
  status:
    $ref: "../../openapi.yaml#/components/schemas/PlayerStatus"
    readOnly: true
  currentServer:
    type:
      - string
      - "null"
    readOnly: true
    maxLength: 255
    description: The server to which the player is currently connected, or `null` if the player is offline.
  currentLocale:
    type:
      - string
      - "null"
    readOnly: true
    description: The locale used by the player's current Minecraft client, or `null` if the player is offline.
  currentClientVersion:
    type:
      - string
      - "null"
    readOnly: true
    description: The version of the player's current Minecraft client, or `null` if the player is offline.
  firstLoginAt:
    type:
      - string
      - "null"
    format: date-time
    description: The date and time at which the player first logged in.
  lastSeenAt:
    type:
      - string
      - "null"
    format: date-time
    description: The date and time at which the player was last seen online.
