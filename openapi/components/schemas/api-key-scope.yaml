type: string
description: >
  A permission granted to an API key. The `*` scope grants every permission.
  The `players:read-details` scope grants the access available with
  `players:read` and also permits access to linked Discord user IDs.
enum:
  - "*"
  - api-keys:read
  - api-keys:write
  - crawls:read
  - crawls:write
  - emojis:read
  - emojis:write
  - patch-notes:read
  - patch-notes:write
  - players:read
  - players:read-details
  - players:write
  - punishments:read
  - punishments:write
