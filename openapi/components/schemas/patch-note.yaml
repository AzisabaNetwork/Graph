type: object
required:
  - id
  - target
  - category
  - title
  - body
  - imageUrls
  - createdAt
properties:
  id:
    $ref: "../../openapi.yaml#/components/schemas/PatchNoteId"

  target:
    $ref: "../../openapi.yaml#/components/schemas/PatchNoteTarget"

  category:
    $ref: "../../openapi.yaml#/components/schemas/PatchNoteCategory"

  title:
    type: string
    description: The title of the patch note.

  body:
    type: string
    description: The body text of the patch note.

  imageUrls:
    type: array
    description: The URLs of images attached to the patch note.
    items:
      type: string
      format: uri

  createdAt:
    type: string
    format: date-time
    description: The date and time at which the patch note was created.
