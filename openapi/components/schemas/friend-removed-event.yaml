type: object
title: FriendRemovedEvent
description: <
  Represents an event indicating that a friendship was removed.
  Requires the `stream:read` scope and either the `players:read` or `players:readDetails` scope to receive this event.
required:
  - type
  - data
properties:
  type:
    const: friend-removed
  data:
    type: object
    title: FriendRemovedEventData
    description: The data associated with the friendship.
    required:
      - player
      - friend
    properties:
      player:
        $ref: "../../openapi.yaml#/components/schemas/Player"
      friend:
        $ref: "../../openapi.yaml#/components/schemas/Player"
