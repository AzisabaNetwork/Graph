type: object
title: PatchNoteDeletedEvent
description: >
  Represents an event indicating that a patch note was deleted.
  Requires the `stream:read` and `patch-notes:read` scopes to receive this event.
required:
  - data
properties:
  data:
    type: object
    title: PatchNoteDeletedEventData
    description: The data associated with the patch note.
    required:
      - patchNote
    properties:
      patchNote:
        $ref: "../../openapi.yaml#/components/schemas/PatchNote"
