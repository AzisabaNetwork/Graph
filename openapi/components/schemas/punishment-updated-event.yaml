type: object
title: PunishmentUpdatedEvent
description: >
  Represents an event indicating that a punishment was updated.
  Requires the `stream:read` and `punishments:read` scopes to receive this event.
required:
  - type
  - data
properties:
  type:
    const: punishment-updated
  data:
    type: object
    title: PunishmentUpdatedEventData
    description: The data associated with the punishment.
    required:
      - punishment
    properties:
      punishment:
        $ref: "../../openapi.yaml#/components/schemas/Punishment"
