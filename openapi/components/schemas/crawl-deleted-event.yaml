type: object
title: CrawlDeletedEvent
description: >
  Represents an event indicating that a crawl was deleted.
  Requires the `stream:read` and `crawls:read` scopes to receive this event.
required:
  - data
properties:
  data:
    type: object
    title: CrawlDeletedEventData
    description: The data associated with the crawl.
    required:
      - crawl
    properties:
      crawl:
        $ref: "../../openapi.yaml#/components/schemas/Crawl"
