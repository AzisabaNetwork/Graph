type: object
required:
  - name
  - publicId
  - scopes
  - createdAt
  - expiresAt
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
    description: Human-readable name of the API key.

  publicId:
    type: string
    minLength: 1
    readOnly: true
    description: Public identifier of the API key.

  scopes:
    type: array
    uniqueItems: true
    description: Scopes granted to the API key.
    items:
      $ref: "../../openapi.yaml#/components/schemas/ApiKeyScope"

  createdAt:
    type: string
    format: date-time
    readOnly: true
    description: Time at which the API key was created.

  expiresAt:
    type:
      - string
      - "null"
    format: date-time
    description: Time at which the API key expires, or `null` if it does not expire.
