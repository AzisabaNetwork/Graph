type: object
description: Metadata and permissions associated with an API key.
required:
  - name
  - publicId
  - scopes
  - createdAt
  - expiresAt
  - playerId
properties:
  name:
    type: string
    minLength: 1
    maxLength: 100
    description: The human-readable name of the API key.
  publicId:
    $ref: "../../openapi.yaml#/components/schemas/ApiKeyId"
    readOnly: true
  scopes:
    type: array
    uniqueItems: true
    description: The scopes granted to the API key.
    items:
      $ref: "../../openapi.yaml#/components/schemas/ApiKeyScope"
  createdAt:
    type: string
    format: date-time
    readOnly: true
    description: The date and time at which the API key was created.
  expiresAt:
    type:
      - string
      - "null"
    format: date-time
    description: The date and time at which the API key expires, or `null` if it does not expire.
  playerId:
    type:
      - string
      - "null"
    format: uuid
    description: The player linked to this API key, or `null` if the key is not linked to a player.
