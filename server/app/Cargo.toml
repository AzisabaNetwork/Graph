[package]
name = "graph-server"
version = "0.0.1"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = "1"
axum = "0.7"
axum-extra = { version = "0.9", features = ["cookie"] }
base64 = "0.22.1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
graph-api = { path = "../generated" }
http = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "migrate", "uuid", "chrono", "mysql"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6.7", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
